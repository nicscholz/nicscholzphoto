<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nic Scholz</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-off: #f7f6f4;
  --border: #e8e6e2;
  --mid: #9e9b96;
  --dark: #3a3835;
  --text: #111110;
  --font-main: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

body.dark {
  --bg: #111110;
  --bg-off: #1c1b1a;
  --border: #2e2d2b;
  --mid: #5f5e5a;
  --dark: #b0ada8;
  --text: #f0ede8;
}

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ── HEADER ── */
header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  transition: background 0.3s, border-color 0.3s;
  gap: 1rem;
}

.site-name {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  color: var(--text);
  text-decoration: none;
  white-space: nowrap;
  flex-shrink: 0;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-width: 0;
}

.photo-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--mid);
  font-weight: 300;
  white-space: nowrap;
}

/* hide photo count in header on small screens */
.header-photo-count { display: inline; }

nav {
  display: flex;
  gap: 1.5rem;
  align-items: center;
  position: relative;
}

nav a {
  font-size: 13px;
  font-weight: 400;
  color: var(--dark);
  text-decoration: none;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: color 0.2s;
  white-space: nowrap;
}

nav a:hover { color: var(--text); }
nav a.active {
  font-weight: 500;
  color: var(--text);
  border-bottom: 1px solid var(--text);
  padding-bottom: 1px;
}

/* ── THEME DOTS ── */
.theme-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  flex-shrink: 0;
}
.dot:hover { transform: scale(1.2); }
.dot-dark { background: #111110; border: 1px solid #111110; }
.dot-light { background: #ffffff; border: 1px solid #111110; }
body.dark .dot-dark { background: #f0ede8; border-color: #f0ede8; }
body.dark .dot-light { background: #111110; border-color: #f0ede8; }
.dot.selected { opacity: 1; transform: scale(1.15); }
.dot:not(.selected) { opacity: 0.4; }

/* ── BUTTONS ── */
.add-btn {
  background: none;
  border: 1px solid var(--text);
  border-radius: 50%;
  font-size: 15px;
  font-weight: 300;
  color: var(--text);
  cursor: pointer;
  line-height: 1;
  width: 25px;
  height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s, background 0.3s, color 0.3s;
  flex-shrink: 0;
  font-family: var(--font-main);
  padding: 0;
}
.add-btn:hover { opacity: 0.45; }

.admin-link {
  font-size: 12px;
  font-weight: 400;
  color: var(--mid);
  cursor: pointer;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: color 0.18s;
  white-space: nowrap;
  flex-shrink: 0;
}
.admin-link:hover { color: var(--text); }

/* ── SHARED BUTTON ── */
.upload-btn {
  background: var(--text);
  color: var(--bg);
  border: none;
  padding: 7px 16px;
  font-family: var(--font-main);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s, background 0.3s, color 0.3s;
  white-space: nowrap;
  flex-shrink: 0;
}
.upload-btn:hover { opacity: 0.75; }
.upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.password-panel {
  background: var(--bg);
  padding: 2.5rem;
  width: 340px;
  max-width: 92vw;
  transition: background 0.3s;
}

.password-panel h2 {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 0.4rem;
}

.password-panel p {
  font-size: 20px;
  font-weight: 300;
  color: var(--text);
  margin-bottom: 1.75rem;
}

.password-input-wrap {
  position: relative;
  margin-bottom: 0.75rem;
}

.password-input-wrap input {
  width: 100%;
  border: 1px solid var(--border);
  border-bottom: 2px solid var(--text);
  background: transparent;
  font-family: var(--font-main);
  font-size: 22px;
  font-weight: 300;
  color: var(--text);
  padding: 8px 0;
  outline: none;
  letter-spacing: 0.2em;
  transition: border-color 0.2s, background 0.3s;
  border-top: none;
  border-left: none;
  border-right: none;
}

.password-input-wrap input::placeholder {
  color: var(--border);
  letter-spacing: 0.1em;
  font-size: 16px;
}

.password-input-wrap input.shake {
  animation: shake 0.35s ease;
  border-bottom-color: #c0392b;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}

.password-error {
  font-family: var(--font-mono);
  font-size: 11px;
  color: #c0392b;
  letter-spacing: 0.05em;
  min-height: 16px;
  margin-bottom: 1.5rem;
}

.password-submit-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}


/* ── MOBILE MENU ── */
.mobile-menu-btn {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text);
  padding: 4px;
  flex-shrink: 0;
}

.mobile-drawer {
  display: none;
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 99;
  padding: 1rem 1.5rem;
  flex-direction: column;
  gap: 0;
  transition: background 0.3s;
}
.mobile-drawer.open { display: flex; }

.mobile-drawer-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  color: var(--dark);
  cursor: pointer;
}
.mobile-drawer-item:last-child { border-bottom: none; }
.mobile-drawer-item:hover { color: var(--text); }

.mobile-drawer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 0;
  border-bottom: 1px solid var(--border);
}
.mobile-drawer-row:last-child { border-bottom: none; }

.mobile-locations-list { padding-left: 1rem; }
.mobile-loc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.65rem 0;
  font-size: 13px;
  color: var(--dark);
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.mobile-loc-item:last-child { border-bottom: none; }
.mobile-loc-item:hover, .mobile-loc-item.active { color: var(--text); font-weight: 500; }
.mobile-loc-all {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.65rem 0;
  font-size: 13px;
  color: var(--mid);
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.mobile-loc-all:hover, .mobile-loc-all.active { color: var(--text); font-weight: 500; }

/* ── LOCATIONS DROPDOWN (desktop) ── */
.locations-dropdown {
  position: absolute;
  top: calc(100% + 16px);
  right: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  min-width: 240px;
  z-index: 200;
  max-height: 380px;
  overflow-y: auto;
  transition: background 0.3s, border-color 0.3s;
}
.locations-dropdown.hidden { display: none; }
.locations-dropdown-inner { padding: 0.5rem 0; }

.loc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 1.25rem;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 13px;
  font-weight: 400;
  color: var(--dark);
}
.loc-item:hover { background: var(--bg-off); color: var(--text); }
.loc-item.active { font-weight: 500; color: var(--text); }

.loc-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mid);
  font-weight: 300;
}

.loc-divider { border: none; border-top: 1px solid var(--border); margin: 0.4rem 0; }

.loc-all {
  font-size: 13px;
  font-weight: 400;
  padding: 9px 1.25rem;
  cursor: pointer;
  color: var(--mid);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.loc-all:hover { background: var(--bg-off); color: var(--text); }
.loc-all.active { font-weight: 500; color: var(--text); }
.loc-empty { padding: 1rem 1.25rem; font-size: 13px; color: var(--mid); font-style: italic; font-weight: 300; }

/* ── MAIN ── */
main { padding: 3rem 2rem 4rem; }

.page-intro { max-width: 480px; margin-bottom: 3rem; }
.page-intro .label {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 0.5rem;
}
.page-intro h1 {
  font-size: 28px;
  font-weight: 300;
  line-height: 1.35;
  color: var(--text);
  margin: 0;
}

/* ── CONTROLS BAR ── */
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
  transition: border-color 0.3s;
}

.controls-right {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

.scatter-btn {
  background: var(--bg-off);
  border: 1px solid var(--border);
  cursor: pointer;
  font-family: var(--font-main);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mid);
  padding: 6px 14px;
  transition: color 0.18s, background 0.18s, border-color 0.18s;
}
.scatter-btn:hover { color: var(--text); border-color: var(--dark); }
.scatter-btn.active { color: var(--bg); background: var(--text); border-color: var(--text); }

.view-toggle { display: flex; gap: 0.5rem; }
.view-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--mid);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  transition: color 0.18s;
}
.view-btn:hover, .view-btn.active { color: var(--text); }
.view-btn svg { display: block; }

/* ── LOCATION SECTIONS ── */
.location-section { margin-bottom: 3.5rem; }

.location-section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.3s;
}
.location-section-header:hover h2 { opacity: 0.7; }
.location-section-header h2 {
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: 0.02em;
  transition: opacity 0.2s;
}
.location-section-header .section-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mid);
  font-weight: 300;
}

/* ── GALLERY ── */
.gallery { columns: 3; column-gap: 12px; }
.gallery.list-view { columns: 1; display: flex; flex-direction: column; gap: 1px; }

.gallery-item { break-inside: avoid; margin-bottom: 12px; display: block; }
.gallery-item-inner {
  position: relative;
  overflow: hidden;
  background: var(--bg-off);
  cursor: pointer;
  transition: background 0.3s;
}

.gallery-item img {
  width: 100%;
  height: auto;
  display: block;
  filter: grayscale(100%);
  transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s;
  -webkit-user-drag: none;
  -khtml-user-drag: none;
  -moz-user-drag: none;
  -o-user-drag: none;
  user-drag: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}
.gallery-item:hover img { transform: scale(1.03); filter: grayscale(0%); }

/* On touch devices there's no hover to reveal color, so show photos in
   full color by default. Targets phones and touch tablets specifically. */
@media (hover: none) {
  .gallery-item img { filter: grayscale(0%); }
}

.item-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 55%);
  opacity: 0;
  transition: opacity 0.3s;
  display: flex;
  align-items: flex-end;
  padding: 0.75rem;
  pointer-events: none;
}
.gallery-item:hover .item-overlay { opacity: 1; }

.item-orient-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 300;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: rgba(0,0,0,0.5);
  color: rgba(255,255,255,0.85);
  padding: 3px 7px;
  opacity: 0;
  transition: opacity 0.3s;
}
.gallery-item:hover .item-orient-badge { opacity: 1; }
/* Location badge shown in Scatter mode — always visible, not hover-gated */
.item-orient-badge.always { opacity: 1; }

.item-caption { margin-top: 8px; padding: 0 2px; }
.item-caption .caption-year {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--mid);
  font-weight: 300;
}

.edit-link {
  margin-top: 4px;
  background: none;
  border: none;
  font-family: var(--font-main);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--mid);
  cursor: pointer;
  padding: 0;
  transition: color 0.18s;
  display: block;
}
.edit-link:hover { color: var(--text); }

/* List view overrides */
.gallery.list-view .gallery-item { margin-bottom: 0; }
.gallery.list-view .gallery-item-inner { display: flex; align-items: center; height: 72px; }
.gallery.list-view .gallery-item-inner img { width: 72px; height: 72px; object-fit: cover; flex-shrink: 0; }
.gallery.list-view .item-overlay { display: none; }
.gallery.list-view .item-orient-badge { display: none; }
.gallery.list-view .item-caption {
  margin-top: 0;
  padding: 0 1.25rem;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  border-bottom: 1px solid var(--border);
  height: 72px;
  transition: border-color 0.3s;
  min-width: 0;
}
.gallery.list-view .edit-link { margin-top: 0; }

/* ── STATES ── */
.empty-state { text-align: center; padding: 5rem 0; color: var(--mid); }
.empty-state p { font-size: 15px; font-weight: 300; }
.loading-state { text-align: center; padding: 5rem 0; color: var(--mid); }
.loading-state p { font-size: 13px; font-weight: 300; font-family: var(--font-mono); letter-spacing: 0.05em; }
.hidden { display: none !important; }

/* ── MODALS ── */
.modal-wrap {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 1rem;
}
.modal-wrap.hidden { display: none !important; }

.panel {
  background: var(--bg);
  padding: 2rem;
  width: 480px;
  max-width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  transition: background 0.3s;
}

.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 2rem;
  gap: 1rem;
}
.panel-header h2 {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mid);
}
.panel-header p {
  font-size: 20px;
  font-weight: 300;
  color: var(--text);
  margin-top: 4px;
}

.close-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 24px;
  color: var(--mid);
  line-height: 1;
  padding: 0;
  flex-shrink: 0;
}
.close-btn:hover { color: var(--text); }

.drop-zone {
  border: 1px dashed var(--border);
  padding: 2rem 1.5rem;
  text-align: center;
  margin-bottom: 1.25rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--dark); background: var(--bg-off); }
.drop-zone p { font-size: 13px; color: var(--mid); font-weight: 300; }
.drop-zone strong { color: var(--dark); font-weight: 500; }

.preview-strip { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.preview-thumb {
  width: 52px;
  height: 52px;
  object-fit: cover;
  filter: grayscale(100%);
  border: 1px solid var(--border);
}

.form-row { margin-bottom: 1rem; }
.form-row label {
  display: block;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 6px;
}
.form-row input, .form-row select {
  width: 100%;
  border: 1px solid var(--border);
  background: var(--bg);
  font-family: var(--font-main);
  font-size: 14px;
  font-weight: 300;
  color: var(--text);
  padding: 9px 12px;
  outline: none;
  appearance: none;
  transition: border-color 0.2s, background 0.3s, color 0.3s;
  -webkit-appearance: none;
}
.form-row input:focus, .form-row select:focus { border-color: var(--dark); }
.form-row input::placeholder { color: var(--mid); }

.form-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

.submit-row {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
  margin-top: 1.5rem;
  align-items: center;
  flex-wrap: wrap;
}

.cancel-btn {
  background: none;
  border: 1px solid var(--border);
  font-family: var(--font-main);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--mid);
  padding: 8px 16px;
  cursor: pointer;
  transition: all 0.18s;
}
.cancel-btn:hover { border-color: var(--dark); color: var(--dark); }

.upload-progress {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--mid);
  font-weight: 300;
}

.error-msg {
  font-size: 12px;
  color: #c0392b;
  margin-top: 0.75rem;
  font-family: var(--font-mono);
}

/* ── LIGHTBOX ── */
.lightbox-wrap {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  z-index: 600;
  transition: background 0.3s;
}
.lightbox-wrap.hidden { display: none !important; }

.lightbox-img-wrap {
  width: 100%;
  max-width: 900px;
  max-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: max-width 0.3s ease, max-height 0.3s ease;
}
.lightbox-img-wrap img {
  max-width: 100%;
  max-height: 70vh;
  object-fit: contain;
  display: block;
  transition: max-width 0.3s ease, max-height 0.3s ease;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  -khtml-user-drag: none;
  -moz-user-drag: none;
  -o-user-drag: none;
  user-drag: none;
  -webkit-touch-callout: none;
}

/* Zoomed: the whole image expands to fill nearly the entire screen, staying fully visible */
.lightbox-wrap.zoomed { padding: 1rem; }
.lightbox-wrap.zoomed .lightbox-img-wrap {
  max-width: 98vw;
  max-height: 88vh;
}
.lightbox-wrap.zoomed .lightbox-img-wrap img {
  max-width: 98vw;
  max-height: 88vh;
  cursor: zoom-out;
}
.lightbox-img-wrap img { cursor: zoom-in; }
/* Hide the caption while zoomed to give the image maximum room */
.lightbox-wrap.zoomed .lightbox-meta { display: none; }

.lightbox-meta { margin-top: 1.25rem; text-align: center; }
.lightbox-meta .loc {
  font-size: 13px;
  font-weight: 500;

<script>
// ── SUPABASE CONFIG ──
const SUPABASE_URL = 'https://agzgdnlhmnpdipbqtyfm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnemdkbmxobW5wZGlwYnF0eWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODMxMTYsImV4cCI6MjA5NTU1OTExNn0.GbBp2oxX2hwxSqhwA4UYBxMZMkGu207AnjfhX7anWLk';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── STATE ──
let photos = [], pendingFiles = [], currentView = 'grid';
let currentLocation = null, lightboxIndex = 0, lightboxPool = [];
let editingPhotoId = null, dropdownOpen = false, mobileMenuOpen = false;
let scatterMode = false, scatterOrder = [];

// ── THEME ──
function setTheme(t) {
  if (t === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('dot-dark').classList.add('selected');
    document.getElementById('dot-light').classList.remove('selected');
  } else {
    document.body.classList.remove('dark');
    document.getElementById('dot-light').classList.add('selected');
    document.getElementById('dot-dark').classList.remove('selected');
  }
  localStorage.setItem('theme', t);
}

// ── SUPABASE ──
function getPublicUrl(storagePath) {
  const { data } = db.storage.from('photos').getPublicUrl(storagePath);
  return data.publicUrl;
}

// Derive the thumbnail path from a full-image path (foo.jpg -> foo_thumb.jpg)
function thumbPathFor(storagePath) {
  return storagePath.replace(/\.jpg$/i, '_thumb.jpg');
}

async function loadPhotos() {
  document.getElementById('loading-state').classList.remove('hidden');
  document.getElementById('gallery-container').innerHTML = '';
  document.getElementById('empty-state').classList.add('hidden');
  const { data, error } = await db.from('photos').select('*').order('created_at', { ascending: false });
  document.getElementById('loading-state').classList.add('hidden');
  if (error) { console.error('Load error:', error); return; }
  photos = (data || []).map(row => ({
    ...row,
    src: getPublicUrl(row.storage_path),                    // full-size, used in lightbox
    thumbSrc: getPublicUrl(thumbPathFor(row.storage_path))  // small, used in gallery grid
  }));
  if (scatterMode) scatterOrder = shuffledPhotos(); // keep scatter fresh after data changes
  renderGallery();
}

// ── MOBILE MENU ──
function toggleMobileMenu(e) {
  e.stopPropagation();
  mobileMenuOpen = !mobileMenuOpen;
  const drawer = document.getElementById('mobile-drawer');
  if (mobileMenuOpen) {
    buildMobileLocations();
    drawer.classList.add('open');
  } else {
    drawer.classList.remove('open');
  }
}

function closeMobileMenu() {
  mobileMenuOpen = false;
  document.getElementById('mobile-drawer').classList.remove('open');
}

function buildMobileLocations() {
  const container = document.getElementById('mobile-locations-container');
  const locs = getLocations();
  container.innerHTML = '';
  const allEl = document.createElement('div');
  allEl.className = 'mobile-loc-all' + (currentLocation === null ? ' active' : '');
  allEl.innerHTML = `<span>All locations</span><span class="loc-count">${photos.length}</span>`;
  allEl.onclick = () => { setLocation(null); closeMobileMenu(); };
  container.appendChild(allEl);
  locs.forEach(([loc, count]) => {
    const el = document.createElement('div');
    el.className = 'mobile-loc-item' + (currentLocation === loc ? ' active' : '');
    el.innerHTML = `<span>${loc}</span><span class="loc-count">${count}</span>`;
    el.onclick = () => { setLocation(loc); closeMobileMenu(); };
    container.appendChild(el);
  });
  if (locs.length === 0) {
    container.innerHTML = '<div style="padding:0.65rem 0;font-size:13px;color:var(--mid);font-style:italic;">No locations yet</div>';
  }
}

document.addEventListener('click', (e) => {
  closeDropdown();
  if (!e.target.closest('.mobile-menu-btn') && !e.target.closest('.mobile-drawer')) {
    closeMobileMenu();
  }
});

// ── LOCATIONS (desktop dropdown) ──
function getLocations() {
  const map = {};
  photos.forEach(p => {
    const loc = p.location || 'Unknown';
    if (!map[loc]) map[loc] = 0;
    map[loc]++;
  });
  return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]));
}

function buildDropdown() {
  const list = document.getElementById('locations-list');
  const locs = getLocations();
  list.innerHTML = '';
  if (photos.length === 0) { list.innerHTML = '<div class="loc-empty">No locations yet</div>'; return; }
  const allEl = document.createElement('div');
  allEl.className = 'loc-all' + (currentLocation === null ? ' active' : '');
  allEl.innerHTML = `<span>All locations</span><span class="loc-count">${photos.length}</span>`;
  allEl.onclick = () => { setLocation(null); closeDropdown(); };
  list.appendChild(allEl);
  const hr = document.createElement('hr'); hr.className = 'loc-divider';
  list.appendChild(hr);
  locs.forEach(([loc, count]) => {
    const el = document.createElement('div');
    el.className = 'loc-item' + (currentLocation === loc ? ' active' : '');
    el.innerHTML = `<span>${loc}</span><span class="loc-count">${count}</span>`;
    el.onclick = () => { setLocation(loc); closeDropdown(); };
    list.appendChild(el);
  });
}

function toggleLocationsDropdown(e) {
  e.stopPropagation();
  dropdownOpen = !dropdownOpen;
  const dd = document.getElementById('locations-dropdown');
  if (dropdownOpen) { buildDropdown(); dd.classList.remove('hidden'); }
  else { dd.classList.add('hidden'); }
}

function closeDropdown() {
  dropdownOpen = false;
  document.getElementById('locations-dropdown').classList.add('hidden');
}

function setLocation(loc) {
  scatterMode = false;
  document.getElementById('scatter-btn').classList.remove('active');
  document.getElementById('location-btn').classList.add('active');
  currentLocation = loc;
  document.getElementById('intro-label').textContent = loc === null ? 'All Locations' : 'Location';
  document.getElementById('intro-title').innerHTML = loc === null ? 'Moments collected.' : loc;
  renderGallery();
}

// Return to the organized, by-location view (exits Scatter)
function showByLocation() {
  setLocation(null);
  closeMobileMenu();
}

function goHome() { setLocation(null); closeMobileMenu(); }

// ── SCATTER ──
// Fisher–Yates shuffle over a copy of all photos
function shuffledPhotos() {
  const arr = photos.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function toggleScatter() {
  if (scatterMode) {
    // Already scattered — reshuffle for a fresh arrangement
    scatterOrder = shuffledPhotos();
    renderGallery();
    return;
  }
  scatterMode = true;
  currentLocation = null;
  scatterOrder = shuffledPhotos();
  document.getElementById('scatter-btn').classList.add('active');
  document.getElementById('location-btn').classList.remove('active');
  document.getElementById('intro-label').textContent = 'Scattered';
  document.getElementById('intro-title').innerHTML = 'Moments collected.';
  closeMobileMenu();
  renderGallery();
}

// ── RENDER ──
function renderGallery() {
  const container = document.getElementById('gallery-container');
  const es = document.getElementById('empty-state');
  const pc = document.getElementById('photo-count');
  const fc = document.getElementById('filtered-count');
  container.innerHTML = '';
  pc.textContent = photos.length + ' photo' + (photos.length !== 1 ? 's' : '');
  if (photos.length === 0) { es.classList.remove('hidden'); fc.textContent = ''; return; }
  es.classList.add('hidden');
  if (scatterMode) {
    // One shuffled wall of all photos, each tagged with its location
    fc.textContent = scatterOrder.length + ' photo' + (scatterOrder.length !== 1 ? 's' : '');
    container.appendChild(buildGalleryEl(scatterOrder, { locationBadge: true }));
  } else if (currentLocation !== null) {
    const filtered = photos.filter(p => (p.location || 'Unknown') === currentLocation);
    fc.textContent = filtered.length + ' photo' + (filtered.length !== 1 ? 's' : '');
    container.appendChild(buildGalleryEl(filtered));
  } else {
    const locs = getLocations();
    let total = 0;
    locs.forEach(([loc, count]) => {
      total += count;
      const section = document.createElement('div');
      section.className = 'location-section';
      const header = document.createElement('div');
      header.className = 'location-section-header';
      header.innerHTML = `<h2>${loc}</h2><span class="section-meta">${count} photo${count !== 1 ? 's' : ''}</span>`;
      header.onclick = () => setLocation(loc);
      const filtered = photos.filter(p => (p.location || 'Unknown') === loc);
      section.appendChild(header);
      section.appendChild(buildGalleryEl(filtered));
      container.appendChild(section);
    });
    fc.textContent = total + ' photo' + (total !== 1 ? 's' : '');
  }
}

function buildGalleryEl(photoList, opts) {
  opts = opts || {};
  const g = document.createElement('div');
  g.className = 'gallery' + (currentView === 'list' ? ' list-view' : '');
  photoList.forEach((photo, idx) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    const inner = document.createElement('div');
    inner.className = 'gallery-item-inner';
    const img = document.createElement('img');
    // Gallery grid loads the small thumbnail to save bandwidth;
    // falls back to the full image if a thumb is missing (older uploads).
    img.src = photo.thumbSrc || photo.src;
    let triedFull = false;
    img.onerror = () => {
      if (!triedFull && img.src !== photo.src) {
        // First failure: try the full-size image
        triedFull = true;
        img.src = photo.src;
      } else {
        // Both failed (file missing from storage) — hide this item entirely
        item.style.display = 'none';
      }
    };
    img.alt = photo.location || 'Photo'; img.loading = 'lazy';
    inner.onclick = () => openLightbox(idx, photoList);
    const overlay = document.createElement('div'); overlay.className = 'item-overlay';
    const badge = document.createElement('div');
    if (opts.locationBadge) {
      // Scatter mode: always-visible location tag in the top-right
      badge.className = 'item-orient-badge always';
      badge.textContent = photo.location || 'Unknown';
    } else {
      // Normal: hover-revealed orientation tag
      badge.className = 'item-orient-badge';
      badge.textContent = photo.orientation;
    }
    inner.appendChild(img); inner.appendChild(overlay); inner.appendChild(badge);
    const caption = document.createElement('div');
    caption.className = 'item-caption';
    const yearEl = document.createElement('div');
    yearEl.className = 'caption-year';
    yearEl.textContent = photo.year || '—';
    caption.appendChild(yearEl);
    if (isAdmin) {
      const editBtn = document.createElement('button');
      editBtn.className = 'edit-link';
      editBtn.textContent = 'Edit';
      editBtn.onclick = (e) => { e.stopPropagation(); openEdit(photo.id); };
      caption.appendChild(editBtn);
    }
    item.appendChild(inner); item.appendChild(caption);
    g.appendChild(item);
  });
  return g;
}

function setView(v) {
  currentView = v;
  document.getElementById('grid-btn').classList.toggle('active', v === 'grid');
  document.getElementById('list-btn').classList.toggle('active', v === 'list');
  renderGallery();
}

// ── AUTHENTICATION (Supabase Auth) ──
let isAdmin = false;

// Reflect login state across the whole UI
function applyAuthState() {
  document.getElementById('add-photo-btn').classList.toggle('hidden', !isAdmin);
  document.getElementById('logout-link').classList.toggle('hidden', !isAdmin);
  document.body.classList.toggle('is-admin', isAdmin);
  renderGallery(); // re-render so Edit links show/hide
}

// Check for an existing session on load, and listen for changes
async function initAuth() {
  const { data } = await db.auth.getSession();
  isAdmin = !!(data && data.session);
  applyAuthState();

  db.auth.onAuthStateChange((_event, session) => {
    isAdmin = !!session;
    applyAuthState();
  });
}

// The admin login page is reached via the #admin hash in the URL
function checkAdminRoute() {
  if (window.location.hash === '#admin' && !isAdmin) {
    openLoginModal();
  }
}
window.addEventListener('hashchange', checkAdminRoute);

function openLoginModal() {
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('login-email').focus(), 50);
}

function closeLoginModal() {
  document.getElementById('login-modal').classList.add('hidden');
  // Clear the #admin hash so closing returns to a clean URL
  if (window.location.hash === '#admin') {
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
}

function handleLoginKey(e) {
  if (e.key === 'Enter') doLogin();
  if (e.key === 'Escape') closeLoginModal();
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-submit-btn');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; return; }
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { error } = await db.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = 'Log in';

  if (error) {
    errEl.textContent = 'Incorrect email or password.';
    return;
  }
  // Success — onAuthStateChange updates the UI
  closeLoginModal();
}

async function doLogout() {
  await db.auth.signOut();
  isAdmin = false;
  applyAuthState();
}

// ── UPLOAD ──
function openUpload() {
  if (!isAdmin) { openLoginModal(); return; }
  document.getElementById('upload-modal').classList.remove('hidden');
  pendingFiles = [];
  document.getElementById('preview-strip').innerHTML = '';
  document.getElementById('input-location').value = currentLocation || '';
  document.getElementById('input-year').value = new Date().getFullYear();
  document.getElementById('input-orient').value = 'auto';
  document.getElementById('upload-error').classList.add('hidden');
  document.getElementById('upload-progress').classList.add('hidden');
  document.getElementById('submit-btn').disabled = false;
}

function closeUpload() {
  document.getElementById('upload-modal').classList.add('hidden');
  pendingFiles = [];
  document.getElementById('preview-strip').innerHTML = '';
}

document.getElementById('file-input').addEventListener('change', function() {
  addFilesToPending(Array.from(this.files)); this.value = '';
});

function addFilesToPending(files) {
  files.forEach(file => {
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      pendingFiles.push({ file, src: e.target.result });
      const thumb = document.createElement('img');
      thumb.src = e.target.result; thumb.className = 'preview-thumb';
      document.getElementById('preview-strip').appendChild(thumb);
    };
    reader.readAsDataURL(file);
  });
}

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); addFilesToPending(Array.from(e.dataTransfer.files)); });

function detectOrientation(img) {
  const r = img.naturalWidth / img.naturalHeight;
  if (r > 2.2) return 'panorama';
  if (r < 0.85) return 'portrait';
  return 'landscape';
}

// ── IMAGE COMPRESSION (runs in the browser before upload) ──
const FULL_MAX_DIMENSION = 2400;   // full-size longest edge (lightbox)
const FULL_QUALITY = 0.82;         // full-size JPEG quality
const THUMB_MAX_DIMENSION = 700;   // thumbnail longest edge (gallery grid)
const THUMB_QUALITY = 0.7;         // thumbnail JPEG quality

// Load a data URL into an Image once, so we can reuse it for both sizes
function loadImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not read image'));
    img.src = dataUrl;
  });
}

// Render a loaded Image to a compressed JPEG Blob at a given max dimension/quality
function renderToBlob(img, maxDim, quality) {
  return new Promise((resolve, reject) => {
    let { width, height } = img;
    if (width > maxDim || height > maxDim) {
      if (width >= height) {
        height = Math.round(height * (maxDim / width));
        width = maxDim;
      } else {
        width = Math.round(width * (maxDim / height));
        height = maxDim;
      }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, width, height);
    canvas.toBlob(
      blob => blob ? resolve(blob) : reject(new Error('Compression failed')),
      'image/jpeg',
      quality
    );
  });
}

async function submitPhotos() {
  if (pendingFiles.length === 0) return;
  const location = document.getElementById('input-location').value.trim() || 'Unknown';
  const year = document.getElementById('input-year').value.trim();
  const orientPref = document.getElementById('input-orient').value;
  const errEl = document.getElementById('upload-error');
  const progressEl = document.getElementById('upload-progress');
  const submitBtn = document.getElementById('submit-btn');
  errEl.classList.add('hidden');
  progressEl.classList.remove('hidden');
  progressEl.textContent = `Processing 0 of ${pendingFiles.length}...`;
  submitBtn.disabled = true;

  // Cache for 1 year — returning visitors pull from browser cache instead of
  // re-downloading, which keeps Supabase egress low.
  const CACHE = '31536000';
  const store = db.storage.from('photos');

  let uploaded = 0;
  for (const { file, src } of pendingFiles) {
    try {
      progressEl.textContent = `Optimizing ${uploaded + 1} of ${pendingFiles.length}...`;

      // Load once, then render both a full-size and a thumbnail version
      const img = await loadImage(src);
      const orient = orientPref !== 'auto' ? orientPref : detectOrientation(img);
      const fullBlob = await renderToBlob(img, FULL_MAX_DIMENSION, FULL_QUALITY);
      const thumbBlob = await renderToBlob(img, THUMB_MAX_DIMENSION, THUMB_QUALITY);

      progressEl.textContent = `Uploading ${uploaded + 1} of ${pendingFiles.length}...`;

      const base = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const fullPath = `${base}.jpg`;
      const thumbPath = `${base}_thumb.jpg`;

      // Upload full-size
      const { error: fullErr } = await store.upload(fullPath, fullBlob, { contentType: 'image/jpeg', cacheControl: CACHE });
      if (fullErr) throw fullErr;

      // Upload thumbnail
      const { error: thumbErr } = await store.upload(thumbPath, thumbBlob, { contentType: 'image/jpeg', cacheControl: CACHE });
      if (thumbErr) throw thumbErr;

      // Save metadata (storage_path points to the full image; thumb path is derived)
      const { error: dbError } = await db.from('photos').insert({ location, year: year || null, orientation: orient, storage_path: fullPath });
      if (dbError) throw dbError;

      uploaded++;
      progressEl.textContent = `Uploaded ${uploaded} of ${pendingFiles.length}...`;
    } catch (err) {
      errEl.textContent = `Upload failed: ${err.message}`;
      errEl.classList.remove('hidden');
      submitBtn.disabled = false;
      progressEl.classList.add('hidden');
      return;
    }
  }
  await loadPhotos();
  closeUpload();
}

// ── EDIT ──
function openEdit(id) {
  if (!isAdmin) { openLoginModal(); return; }
  _openEdit(id);
}

function _openEdit(id) {
  const photo = photos.find(p => p.id === id);
  if (!photo) return;
  editingPhotoId = id;
  document.getElementById('edit-thumb').src = photo.src;
  document.getElementById('edit-location').value = photo.location || '';
  document.getElementById('edit-year').value = photo.year || '';
  document.getElementById('edit-orient').value = photo.orientation || 'landscape';
  document.getElementById('edit-error').classList.add('hidden');
  document.getElementById('edit-progress').classList.add('hidden');
  document.getElementById('edit-submit-btn').disabled = false;
  document.getElementById('edit-modal').classList.remove('hidden');
}

function closeEdit() {
  document.getElementById('edit-modal').classList.add('hidden');
  editingPhotoId = null;
}

async function saveEdit() {
  const photo = photos.find(p => p.id === editingPhotoId);
  if (!photo) return;
  const errEl = document.getElementById('edit-error');
  const progressEl = document.getElementById('edit-progress');
  const submitBtn = document.getElementById('edit-submit-btn');
  errEl.classList.add('hidden');
  progressEl.classList.remove('hidden');
  submitBtn.disabled = true;
  const updates = {
    location: document.getElementById('edit-location').value.trim() || 'Unknown',
    year: document.getElementById('edit-year').value.trim() || null,
    orientation: document.getElementById('edit-orient').value
  };
  const { error } = await db.from('photos').update(updates).eq('id', photo.id);
  if (error) {
    errEl.textContent = `Save failed: ${error.message}`;
    errEl.classList.remove('hidden');
    submitBtn.disabled = false;
    progressEl.classList.add('hidden');
    return;
  }
  await loadPhotos();
  closeEdit();
}

async function confirmDelete() {
  const photo = photos.find(p => p.id === editingPhotoId);
  if (!photo) return;
  if (!confirm(`Delete this photo from ${photo.location || 'Unknown'}? This cannot be undone.`)) return;
  // Remove both the full image and its thumbnail
  await db.storage.from('photos').remove([photo.storage_path, thumbPathFor(photo.storage_path)]);
  await db.from('photos').delete().eq('id', photo.id);
  closeEdit();
  closeLightbox();
  await loadPhotos();
}

function openEditFromLightbox() {
  const photo = lightboxPool[lightboxIndex];
  if (photo) openEdit(photo.id);
}

// ── LIGHTBOX ──
let isZoomed = false;

function openLightbox(idx, pool) {
  lightboxPool = pool; lightboxIndex = idx;
  showLightboxPhoto();
  document.getElementById('lightbox').classList.remove('hidden');
  document.addEventListener('keydown', lightboxKey);
}

function showLightboxPhoto() {
  const p = lightboxPool[lightboxIndex];
  document.getElementById('lightbox-img').src = p.src;
  document.getElementById('lightbox-location').textContent = p.location || '';
  document.getElementById('lightbox-year').textContent = p.year || '';
  document.getElementById('lb-edit-btn').classList.toggle('hidden', !isAdmin);
  resetZoom();
}

function closeLightbox() {
  document.getElementById('lightbox').classList.add('hidden');
  document.removeEventListener('keydown', lightboxKey);
  resetZoom();
}

function navLightbox(dir) {
  lightboxIndex = (lightboxIndex + dir + lightboxPool.length) % lightboxPool.length;
  showLightboxPhoto();
}

function lightboxKey(e) {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navLightbox(1);
  if (e.key === 'ArrowLeft') navLightbox(-1);
}

// ── ZOOM (expand whole image to fill screen, fully visible) ──
function resetZoom() {
  isZoomed = false;
  document.getElementById('lightbox').classList.remove('zoomed');
  const btn = document.getElementById('lb-zoom-btn');
  btn.classList.remove('active');
  btn.textContent = 'Zoom in';
}

function toggleZoom() {
  isZoomed = !isZoomed;
  const lightbox = document.getElementById('lightbox');
  const btn = document.getElementById('lb-zoom-btn');
  if (isZoomed) {
    lightbox.classList.add('zoomed');
    btn.classList.add('active');
    btn.textContent = 'Zoom out';
  } else {
    lightbox.classList.remove('zoomed');
    btn.classList.remove('active');
    btn.textContent = 'Zoom in';
  }
}

// Click the image itself to toggle zoom
document.getElementById('lightbox-img').addEventListener('click', toggleZoom);

// ── TOUCH: swipe to navigate between photos ──
let touchStartX = 0, touchStartY = 0;
const lightboxEl = document.getElementById('lightbox');

lightboxEl.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

lightboxEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    navLightbox(dx < 0 ? 1 : -1);
  }
}, { passive: true });

// ── IMAGE PROTECTION ──
// Block right-click / long-press context menu on photos (gallery + lightbox)
document.addEventListener('contextmenu', e => {
  if (e.target && e.target.tagName === 'IMG' && e.target.closest('.gallery-item, .lightbox-img-wrap')) {
    e.preventDefault();
  }
});
// Block drag-start on any photo
document.addEventListener('dragstart', e => {
  if (e.target && e.target.tagName === 'IMG' && e.target.closest('.gallery-item, .lightbox-img-wrap')) {
    e.preventDefault();
  }
});

// ── INIT ──
const savedTheme = localStorage.getItem('theme') || 'light';
setTheme(savedTheme);

(async () => {
  await initAuth();      // restore any existing login session
  await loadPhotos();    // load the gallery
  checkAdminRoute();     // if the URL is #admin and not logged in, show login
})();
</script>
